name: Create React Web App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-react-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create React App (Vite)
        run: |
          npm create vite@latest kvinitkarmkar -- --template react
          cd kvinitkarmkar
          npm install

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Create React Vite app: kvinitkarmkar" || echo "Nothing to commit"
          git push

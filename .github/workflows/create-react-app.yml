name: Create React App in Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-react-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean Repository Root
        run: |
          find . -mindepth 1 \
            ! -path "./.git" \
            ! -path "./.git/*" \
            ! -path "./.github" \
            ! -path "./.github/*" \
            -exec rm -rf {} +

      - name: Create React App (Root)
        run: |
          npm init vite@latest . -- --template react --force
          npm install

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Initialize React Vite app in repository root"
            git push origin HEAD
          fi
